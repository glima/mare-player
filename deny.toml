# Dependency licence policy, enforced by `just check`.
#
# The project is GPL-3.0-only, so a dependency has to be GPL-3.0-compatible:
# permissive licences, and copyleft only where it is compatible in this
# direction. Anything Apache-2.0-only would be fine here but not under GPLv2,
# which is why the allow list is explicit rather than "whatever cargo found".

[licenses]
allow = [
    "GPL-3.0-only",      # the project itself, and cosmic-protocols / cctk
    "MPL-2.0",           # libcosmic; file-level copyleft, GPL-compatible
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",       # unicode-ident and friends
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",  # webpki-root-certs: a certificate bundle, not code
]

# CDDL is not GPL-compatible, so this one is scoped rather than allowed:
# inferno renders the flamegraph for the SIGUSR1 profiler, which is compiled
# only under `cfg(debug_assertions)` and stripped from release builds — the
# ones that get distributed. If the profiler ever ships in a release binary,
# this exception has to go and pprof with it.
exceptions = [
    { crate = "inferno", allow = ["CDDL-1.0"] },
]

# Crates whose manifests carry no `license` field at all. All are pop-os
# workspace members published only as git dependencies; the licence recorded
# here is the one in the repository they ship from, not a guess about intent.
[[licenses.clarify]]
crate = "cosmic-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-config-derive"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-theme"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-panel-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "cosmic-settings-daemon"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "xdg-shell-wrapper-config"
expression = "MPL-2.0"
license-files = []

[[licenses.clarify]]
crate = "iced_accessibility"
expression = "MIT"
