name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  # Retry transient crates.io/registry download failures (e.g. a dropped TLS
  # connection: `curl [55] SSL_ERROR_SYSCALL`) instead of failing the job.
  CARGO_NET_RETRY: "10"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libsecret-1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libinput-dev \
            libudev-dev \
            libseat-dev \
            libexpat1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@8e6bcdad38b75e3ed7b36872031a94f7c61006cc # cargo-nextest

      # `just check` skips whichever of these is missing, which is right for a
      # laptop and wrong for CI: unused dependencies, security advisories and
      # dependency licences were all being reported as "not found, skipping"
      # rather than gating anything.
      - name: Install cargo-machete
        uses: taiki-e/install-action@cdcb1f492e0a327e6492f6748d9a637ac2ffd66f # cargo-machete

      - name: Install cargo-audit
        uses: taiki-e/install-action@55ed588c2f0e092949af25ad4c5873185e476b5c # cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@e7755904d936cb033d6d742aa409597c6a104079 # cargo-deny

      - name: Cache cargo registry and build artifacts
        # Without this the job compiles all ~870 crates on every push. The key
        # follows Cargo.lock, so dependencies are built once per lockfile
        # change; `save-if` keeps pull requests restoring without each of them
        # writing an entry, since the repo cache is capped at 10 GB and evicts
        # by age.
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: ci-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `just check` (clippy + `cargo test --no-run`) and `just test-matrix`
      # both compile the root package, so the workspace build that used to sit
      # here only added a fourth compile of it. What they never touch is the
      # companion binary, which is a separate workspace member — so build that
      # alone, and let the steps below cover the rest.
      - name: Build mare-video-window
        run: cargo build -p mare-video-window

      - name: Check/sanitize
        run: just check

      - name: Run tests (applet + standalone)
        run: just test-matrix

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results
          files: target/nextest/applet/junit.xml,target/nextest/standalone/junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libsecret-1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libinput-dev \
            libudev-dev \
            libseat-dev \
            libexpat1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e5de28abeb52d916c5e5875d54b21a9e738b61ec # cargo-llvm-cov

      - name: Cache cargo registry and build artifacts
        # Kept separate from ci-build: llvm-cov compiles the tree with coverage
        # instrumentation, so none of those artifacts are interchangeable with
        # the ones the build job produces.
        uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
        with:
          shared-key: ci-coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Generate LCOV coverage report
        run: just coverage-summary && cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex '/tests?/|/target/'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
