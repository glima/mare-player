name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Run weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

permissions: read-all

env:
  # Retry transient crates.io/registry download failures instead of failing.
  CARGO_NET_RETRY: "10"

jobs:
  analyze:
    name: Analyze (Rust)
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libsecret-1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libinput-dev \
            libudev-dev \
            libseat-dev \
            libexpat1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: rust

      # Same dependency cache as CI, under its own key: CodeQL builds through
      # its extractor, so its artifacts are not interchangeable with the ones
      # the build or coverage jobs produce.
      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: codeql
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: |
          # The extractor builds its database by watching the compiler work, so
          # our own crates have to compile here even on a cache hit — only the
          # dependencies are safe to restore. Without this, a push that changed
          # nothing cargo cares about would analyse almost nothing.
          cargo clean -p cosmic-applet-mare -p mare-video-window
          cargo build --verbose

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:rust"
