version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Main crate (crates.io deps). The git deps — libcosmic, cosmic-panel,
  # tidlers — track upstream default branches and are updated by hand via
  # `cargo update`; Dependabot leaves those alone and only bumps registry deps.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # The cargo-fuzz harness is a *separate* workspace (excluded from the main
  # one), so its lockfile isn't touched by the main `cargo update` and drifts —
  # stale entries then trip Dependabot's security scan. Have Dependabot keep it
  # current instead. Dev-only; never ships in the applet.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # Listed only to switch on the `std` feature of the copy turso_core
      # uses (see fuzz/Cargo.toml), so it must stay on turso_core's version;
      # for a 0.x crate, 0.4 -> 0.5 is a minor update.
      - dependency-name: "branches"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
