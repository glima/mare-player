[package]
name = "cosmic-applet-mare-fuzz"
version = "0.3.8"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

# Its own workspace, with its own lockfile. Without this, cargo looks for
# one in the directories above and can claim fuzz/ for an unrelated
# workspace, e.g. when this checkout sits inside another one.
[workspace]

# `branches` is listed only to switch on its `std` feature (see below).
[package.metadata.cargo-machete]
ignored = ["branches"]

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.cosmic-applet-mare]
path = ".."
default-features = false

[[bin]]
name = "fuzz_lrc_parse"
path = "fuzz_targets/fuzz_lrc_parse.rs"
test = false
doc = false
bench = false

# cargo-fuzz needs nightly (its instrumentation flags are unstable). On
# nightly, `branches` (pulled in by turso_core with default features off)
# switches its no-std abort() to `core::intrinsics::abort`, which current
# nightlies no longer have. Turning on its `std` feature makes it call
# `std::process::abort` instead. Normal stable builds are unaffected.
# The version must be the one turso_core uses, or the feature lands on a
# second copy that nothing calls (Dependabot is told to leave it).
[dependencies.branches]
version = "0.4"
features = ["std"]
